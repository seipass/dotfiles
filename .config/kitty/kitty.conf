# Font
font_family      Ioskeley Mono Term
bold_font        auto
italic_font      auto
bold_italic_font auto

# Keep Latin a bit tighter, CJK falls back to a proper Japanese mono font
symbol_map U+3000-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

# Slightly larger than default for better readability
font_size 11.5

# Smooth text-cursor movement
cursor_trail 20
cursor_trail_decay 0.08 0.24
cursor_trail_start_threshold 1

# Font size shortcuts
map ctrl+shift+equal   increase_font_size
map ctrl+shift+minus   decrease_font_size
map ctrl+shift+backspace reset_font_size

# Ink-blue canvas, with bright accents for terminal output.
background #10141e
foreground #dce5f5
cursor #a5c9ff
cursor_text_color #10141e
selection_background #354b70
selection_foreground #f0f5ff
url_color #8be0e0
color0 #202838
color1 #f18e9c
color2 #a5d9b0
color3 #ecc58a
color4 #a5c9ff
color5 #c4abf2
color6 #8bd5dc
color7 #c0cce1
color8 #8593af
color9 #ffabb7
color10 #bdf2c6
color11 #ffdb9f
color12 #c2dcff
color13 #dfcaff
color14 #a5f0f1
color15 #f1f5ff

# Window and tab chrome
window_padding_width 10 14
hide_window_decorations yes
active_border_color #a5c9ff
inactive_border_color #303b50
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #171e2c
active_tab_background #a5c9ff
active_tab_foreground #111a2b
inactive_tab_background #232d40
inactive_tab_foreground #b7c5de
tab_title_template "{index}: {title}"

# Quickshell writes this override when the palette changes.
# Shell palette revision: a226d133bc59
include shell-palette.conf
