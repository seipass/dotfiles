  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#iconBg)" stroke="#3d4758" stroke-width="3"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#iconGlow)"/>

  <!-- Left Rail -->
  <rect x="38" y="38" width="28" height="180" rx="14" fill="#0d1015" stroke="#2c3442" stroke-width="2"/>
  <circle cx="52" cy="60" r="6" fill="#b6c8e2"/>
  <circle cx="52" cy="80" r="4" fill="#5e6a7d"/>
  <circle cx="52" cy="96" r="4" fill="#5e6a7d"/>
  <rect x="44" y="182" width="16" height="22" rx="8" fill="#374c6c"/>

