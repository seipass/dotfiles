<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="HaDE Icon">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19202b"/>
      <stop offset="100%" stop-color="#11151a"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#b6c8e2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#11151a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
