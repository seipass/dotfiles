  <circle cx="98" cy="52" r="5.5" fill="#b6c8e2"/>
  <rect x="112" y="48" width="42" height="8" rx="4" fill="#e1e5ea" opacity="0.88"/>
  <rect x="178" y="48" width="26" height="8" rx="4" fill="#b6c8e2" opacity="0.65"/>

